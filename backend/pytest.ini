# pytest 配置文件
# Pytest Configuration File

[pytest]
# 測試目錄
testpaths = tests

# 測試文件模式
python_files = test_*.py

# 測試類模式
python_classes = Test*

# 測試函數模式
python_functions = test_*

# 預設執行選項
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app/services
    --cov-report=html
    --cov-report=term-missing
    --asyncio-mode=auto

# 測試標記定義
markers =
    unit: Unit tests (單元測試)
    integration: Integration tests (整合測試)
    e2e: End-to-end tests (端到端測試)
    slow: Slow running tests (耗時測試)
    db: Tests requiring database (需要資料庫的測試)
    cache: Cache related tests (快取相關測試)
    embedding: Embedding related tests (Embedding 相關測試)
    pipeline: Pipeline tests (流程測試)

# asyncio 配置
asyncio_mode = auto

# 最小 Python 版本
minversion = 7.0

# 測試發現配置
norecursedirs = 
    .git
    .venv
    __pycache__
    venv
    env
    dist
    build
    *.egg

# 日誌配置
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 警告過濾
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 輸出選項
console_output_style = progress
