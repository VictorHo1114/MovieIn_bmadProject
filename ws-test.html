<!DOCTYPE html>
<html>
<head><title>WebSocket Test</title></head>
<body style="background:#1a1a2e;color:#eee;font-family:monospace;padding:20px">
<h2> WebSocket 連線測試工具</h2>
<div id="status">狀態: <span id="statusText">未連線</span></div>
<div style="margin:20px 0">
  <label>Token: <input id="token" style="width:400px" placeholder="輸入 JWT token"></label><br>
  <button onclick="connect()" style="margin-top:10px;padding:8px 16px">連線</button>
  <button onclick="disconnect()" style="padding:8px 16px">斷線</button>
</div>
<div>
  <label>訊息: <input id="msg" placeholder="輸入訊息" style="width:300px"></label>
  <button onclick="send()">發送</button>
</div>
<div id="log" style="margin-top:20px;background:#0f0f1e;padding:10px;height:400px;overflow-y:auto;border:1px solid #333"></div>

<script>
let ws = null;

function log(msg, color='#0f0') {
  const div = document.getElementById('log');
  const time = new Date().toLocaleTimeString();
  div.innerHTML += <div style="color:">[] </div>;
  div.scrollTop = div.scrollHeight;
}

function connect() {
  const token = document.getElementById('token').value;
  if (!token) return alert('請輸入 token');
  
  const wsUrl = ws://127.0.0.1:8000/api/v1/ws/chat?token=;
  log('連線中: ' + wsUrl, '#ff0');
  
  ws = new WebSocket(wsUrl);
  
  ws.onopen = () => {
    log(' WebSocket 已連線', '#0f0');
    document.getElementById('statusText').textContent = '已連線';
    document.getElementById('statusText').style.color = '#0f0';
  };
  
  ws.onmessage = (e) => {
    log(' 收到: ' + e.data, '#0ff');
  };
  
  ws.onerror = (e) => {
    log(' 錯誤: ' + JSON.stringify(e), '#f00');
  };
  
  ws.onclose = (e) => {
    log( 斷線 (code: , reason: ), '#fa0');
    document.getElementById('statusText').textContent = '已斷線';
    document.getElementById('statusText').style.color = '#f00';
  };
}

function disconnect() {
  if (ws) {
    ws.close();
    log('主動斷線', '#fa0');
  }
}

function send() {
  const msg = document.getElementById('msg').value;
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    return alert('未連線');
  }
  ws.send(msg);
  log(' 發送: ' + msg, '#ff0');
  document.getElementById('msg').value = '';
}
</script>
</body>
</html>
